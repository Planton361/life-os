name: PR Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".node-version"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Diff check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            before="${{ github.event.before }}"

            if [[ "$before" =~ ^0+$ ]]; then
              if git rev-parse HEAD^1 >/dev/null 2>&1; then
                git diff --check HEAD^1...HEAD
              else
                git diff-tree --check --root -r HEAD
              fi
            else
              git diff --check "$before...HEAD"
            fi
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Preview CD policy and isolated service fixtures
        run: pnpm test:preview:cd

      - name: Native SQLite and application composition (Linux x64)
        run: pnpm exec vitest run --config tests/sqlite/application-vitest.config.mjs

      - name: Production Next build and native shutdown proof (Linux x64)
        run: |
          pnpm build
          node tests/sqlite/retired-runtime-proof.mjs
          node tests/sqlite/framework-shutdown-proof.mjs
          node tests/sqlite/application-smoke.mjs
          pnpm test:sqlite:hosted
