name: PR Quality

# Every PR gets the fast checks. The browser/preview proofs ("full") run when a PR
# touches auth, persistence, preview/ops, the CI proof suites or CI itself, when it carries the
# `full-ci` label, on every push to main, nightly and on manual dispatch.
# `quality` is the required status check and gates on both.

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Decide whether the full proof suite is required
        id: scope
        shell: bash
        env:
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" || "$FULL_LABEL" == "true" ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          risky='^(\.github/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.node-version$|next\.config\.|supabase/|scripts/|tests/(sqlite|supabase)/|src/instrumentation\.ts$|src/app/api/|src/lib/supabase/|src/features/(auth|real-data)/)'
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")"
          matches="$(grep -E "$risky" <<<"$changed" || true)"
          if [[ -n "$matches" ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            printf 'Full suite required by:\n%s\n' "$matches"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "No risk-scoped paths changed; fast checks only."
          fi

  fast:
    name: fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".node-version"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Diff check
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            before="${{ github.event.before }}"

            if [[ "$before" =~ ^0+$ ]]; then
              if git rev-parse HEAD^1 >/dev/null 2>&1; then
                git diff --check HEAD^1...HEAD
              else
                git diff-tree --check --root -r HEAD
              fi
            else
              git diff --check "$before...HEAD"
            fi
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Native SQLite and application composition (Linux x64)
        run: pnpm exec vitest run --config tests/sqlite/application-vitest.config.mjs

      - name: Linux preview operator and live WAL recovery fixtures
        run: pnpm test:preview:linux

      - name: Production build, server smoke and native shutdown proof (Linux x64)
        run: |
          pnpm build
          node tests/sqlite/retired-runtime-proof.mjs
          node tests/sqlite/framework-shutdown-proof.mjs
          node tests/sqlite/application-smoke.mjs
          pnpm test:sqlite:hosted

  full:
    name: full proofs
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".node-version"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Preview CD policy and isolated service fixtures
        run: pnpm test:preview:cd

      - name: Install isolated browser engine
        run: pnpm exec playwright install --with-deps chromium

      - name: Production browser proofs (Linux x64)
        run: |
          pnpm build
          node --test tests/sqlite/browser-route-diagnostics.test.mjs
          node tests/sqlite/browser-route-diagnostics-injected.mjs
          node tests/sqlite/issue-172-browser-proof.mjs
          node tests/sqlite/issue-170-browser-proof.mjs
          node tests/sqlite/issue-160-browser-proof.mjs
          node tests/sqlite/issue-158-browser-proof.mjs
          node tests/sqlite/issue-155-browser-proof.mjs
          node tests/sqlite/issue-153-browser-proof.mjs
          node tests/sqlite/issue-151-browser-proof.mjs
          node tests/sqlite/issue-142-calendar-hydration-proof.mjs
          node tests/sqlite/issue-190-browser-proof.mjs
          node tests/sqlite/issue-142-browser-proof.mjs --standard-negative --linux

      - name: Preview composition and isolated reset browser proof (Linux x64)
        run: |
          LIFE_OS_BUILD_COMPOSITION=personal-preview-v2 pnpm build
          node tests/sqlite/issue-142-calendar-hydration-proof.mjs --preview
          node --conditions=react-server tests/sqlite/issue-142-browser-proof.mjs --linux

      # Mirrors the former per-proof uploads that used `if-no-files-found: error`.
      - name: Require mandatory browser proof evidence
        if: always()
        shell: bash
        run: |
          missing=0
          require() {
            local name=$1 p; shift
            for p in "$@"; do
              [[ -n "$(find $p -type f -print -quit 2>/dev/null)" ]] && return 0
            done
            echo "::error::Missing mandatory $name evidence"
            missing=1
          }
          require issue-153 test-results/issue-153/
          require issue-155 test-results/issue-155/
          require issue-158 test-results/issue-158/
          require issue-160 "test-results/issue-160/*.png" test-results/issue-160/route-diagnostics/ test-results/issue-160/synthetic-injection/
          require issue-170 "test-results/issue-170/*.png" test-results/issue-170/route-diagnostics/ test-results/issue-170/synthetic-injection/
          require issue-172 test-results/issue-172/
          require issue-190 "test-results/issue-190/*.png"
          exit "$missing"

      - name: Preserve disposable browser proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: disposable-browser-proof-evidence
          path: |
            test-results/issue-142/*.png
            test-results/issue-142/proof.json
            test-results/issue-142-calendar/*.png
            test-results/issue-142-calendar/*.json
            test-results/issue-151/*.png
            test-results/issue-151/proof.json
            test-results/issue-153/
            test-results/issue-155/
            test-results/issue-158/
            test-results/issue-160/*.png
            test-results/issue-160/route-diagnostics/
            test-results/issue-160/synthetic-injection/
            test-results/issue-170/*.png
            test-results/issue-170/route-diagnostics/
            test-results/issue-170/synthetic-injection/
            test-results/issue-172/
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: quality
    needs: [scope, fast, full]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require fast checks and, when in scope, the full proofs
        shell: bash
        run: |
          echo "scope=${{ needs.scope.result }} full-required=${{ needs.scope.outputs.full }} fast=${{ needs.fast.result }} full=${{ needs.full.result }}"
          [[ "${{ needs.scope.result }}" == "success" ]] || exit 1
          [[ "${{ needs.fast.result }}" == "success" ]] || exit 1
          if [[ "${{ needs.scope.outputs.full }}" == "true" ]]; then
            [[ "${{ needs.full.result }}" == "success" ]] || exit 1
          else
            [[ "${{ needs.full.result }}" == "skipped" ]] || exit 1
          fi
